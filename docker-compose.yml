# ps-throttle: PlayStation Bandwidth Guardian
#
# This docker-compose file includes ps-throttle and an example
# Transmission setup. If you already have Transmission running,
# see docker-compose.override.yml.example for how to add ps-throttle
# to your existing stack.

services:
  ps-throttle:
    image: ps-throttle-ps-throttle
    container_name: ps-throttle
    restart: unless-stopped
    network_mode: host   # Required to ping PS on local network
    cap_add:
      - NET_RAW          # Required for ping
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker self-discovery
      - /home/orangepi/ps-throttle/src:/app/src:ro
      - /usr/local/bin/node:/usr/local/bin/node:ro
      - /usr/local/bin/node:/usr/bin/node:ro
      - /usr/local/bin/playactor:/usr/local/bin/playactor:ro
      - /usr/local/lib/node_modules:/usr/local/lib/node_modules:ro
      - /home/orangepi/.config/playactor:/root/.config/playactor:ro
    environment:
      # Node & PlayActor environment
      NODE_PATH: "/usr/local/lib/node_modules/playactor/node_modules:/usr/local/lib/node_modules"

      # PlayStation IP address
      PS_IP: "192.168.9.22"

      # How often to check PS status (seconds)
      CHECK_INTERVAL: "10"

      # How many consecutive inactive checks before considering PS off
      DEBOUNCE_COUNT: "5"

      # Detection methods: ddp (1ms UDP standby-aware), tcp (port probe), playactor (official Remote Play)
      DETECTION_METHODS: "ddp,tcp,playactor"

      # Speed limits when PS is active (KB/s)
      THROTTLE_DOWN_KB: "50"
      THROTTLE_UP_KB: "20"

      # Docker container filter (matches image name or container name)
      TRANSMISSION_FILTER: "transmission"

      # Re-discovery interval for Transmission containers (seconds)
      DISCOVERY_INTERVAL: "60"

      # Fallback RPC credentials (used if not auto-detected from container env)
      # TRANSMISSION_USER: ""
      # TRANSMISSION_PASS: ""

      # Web Dashboard (accessible at http://<host-ip>:9870)
      WEB_ENABLED: "true"
      WEB_PORT: "9870"

      # Log level: DEBUG, INFO, WARNING, ERROR
      LOG_LEVEL: "INFO"
